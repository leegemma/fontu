<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>폰투 — 무료 한글 폰트 다운로드</title>
  <link rel="stylesheet" href="style.css?v=1" />
</head>
<body>
  <header>
    <h1 class="logo">폰투</h1>
    <p class="tagline">상업적 사용 가능한 무료 한글 폰트 모음</p>
  </header>

  <main>
    <section class="filters">
      <input type="text" id="searchInput" placeholder="폰트 이름, 디자이너, 태그 검색" />
      <div class="filter-row">
        <select id="categoryFilter">
          <option value="">전체 분류</option>
        </select>
        <select id="licenseFilter">
          <option value="">전체 라이선스</option>
        </select>
      </div>
      <div class="preview-row">
        <label for="previewInput">미리보기 텍스트</label>
        <input type="text" id="previewInput" value="다람쥐 헌 쳇바퀴에 타고파" maxlength="40" />
        <div class="size-control">
          <input type="range" id="sizeRange" min="16" max="72" value="32" />
          <span id="sizeLabel">32px</span>
        </div>
      </div>
      <div class="result-count" id="resultCount"></div>
    </section>

    <section class="font-list" id="fontList"></section>
  </main>

  <footer>
    <small>© 2026 폰투 · 폰트 저작권은 각 제작자에게 있습니다</small>
  </footer>

  <script src="script.js?v=1"></script>
</body>
</html>
